<rect x="612" y="130" width="128" height="24" rx="12" fill="none" stroke="#9198a1" stroke-width="1"/>
<text x="676.0" y="146" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle">draft</text>
