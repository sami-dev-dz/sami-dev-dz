<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-label="Editorial pipeline: four RSS feeds, two deduplication stages, an LLM drafting step, then a human review gate with three outcomes - publish, draft, or cancel, which deletes the uploaded image.">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d444d"/></marker></defs>
<rect x="12" y="26" width="128" height="52" rx="6" fill="none" stroke="#3d444d" stroke-width="1"/>
<text x="76.0" y="48" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">4 RSS feeds</text>
<text x="76.0" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">TechCrunch, Verge,</text>
