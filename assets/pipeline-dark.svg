<text x="226.0" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">in-memory cache</text>
<line x1="293" y1="52.0" x2="308" y2="52.0" stroke="#3d444d" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="312" y="26" width="128" height="52" rx="6" fill="none" stroke="#3d444d" stroke-width="1"/>
<text x="376.0" y="48" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">dedupe</text>
<text x="376.0" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">WordPress API</text>
<line x1="443" y1="52.0" x2="458" y2="52.0" stroke="#3d444d" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="462" y="26" width="128" height="52" rx="6" fill="none" stroke="#3d444d" stroke-width="1"/>
<text x="526.0" y="48" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">draft + cover</text>
<text x="526.0" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">Gemini 2.5 Pro</text>
