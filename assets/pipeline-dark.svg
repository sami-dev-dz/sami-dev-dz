<text x="676.0" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" font-weight="400" fill="#9198a1" text-anchor="middle">Telegram</text>
